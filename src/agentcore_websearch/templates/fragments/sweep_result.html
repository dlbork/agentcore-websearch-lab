<table style="width:100%; border-collapse: collapse;">
  <thead>
    <tr>
      <th style="text-align:left; border-bottom: 1px solid var(--border); padding: 0.4rem;">maxResults</th>
      <th style="text-align:left; border-bottom: 1px solid var(--border); padding: 0.4rem;">results returned</th>
      <th style="text-align:left; border-bottom: 1px solid var(--border); padding: 0.4rem;">cache hit</th>
    </tr>
  </thead>
  <tbody>
    {% for comp in comparisons %}
      <tr>
        <td style="padding: 0.4rem;">{{ comp.label }}</td>
        <td style="padding: 0.4rem;">{{ comp.results | length }}</td>
        <td style="padding: 0.4rem;">{{ 'yes' if comp.cache_hit else 'no' }}</td>
      </tr>
    {% endfor %}
  </tbody>
</table>
